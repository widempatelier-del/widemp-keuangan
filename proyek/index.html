<html lang="id">

<title>Widemp Atelier · Pemantau Proyek</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="appcss">
:root{--bg:#f6f4f0;--card:#fff;--ink:#1f1d1a;--mut:#6f6a62;--line:#e6e1d8;--acc:#b5653b;--acc2:#f3e4da;--ok:#2f7d55;--okb:#e2f1e8;--warn:#b07a12;--warnb:#fbf0d6;--bad:#b3392f;--badb:#f8e1de;--blue:#2f5f8a;--blueb:#e1ebf4;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:20px}h3{font-size:16px}h4{font-size:14px}
a{color:var(--blue)}
.app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:#1f1d1a;color:#eee;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:15px;padding:4px 10px 16px;letter-spacing:.02em}
.brand small{display:block;font-weight:400;color:#aaa;font-size:11px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:#d9d6d0;text-decoration:none;font-weight:500}
.nav a.on{background:var(--acc);color:#fff}
.nav a:hover:not(.on){background:#2d2a26}
.nav .ic{width:18px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top select{max-width:260px}
.sync{font-size:12px;color:var(--mut);margin-left:auto;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn)}.dot.off{background:var(--bad)}
.tabs{display:none}
#view{padding:20px;max-width:1200px;width:100%}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hd .sp{flex:1}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:22px;margin-top:2px;line-height:1.2}
.kpi b.txt{font-size:15px}
.tmgrid{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;align-items:end}
.kpi span{color:var(--mut);font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#cfc8bb}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%}
textarea{resize:vertical}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fld small{color:var(--mut);font-size:11px}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-weight:500}
.chk input{width:auto}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#eee;color:#555;white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.warn{background:var(--warnb);color:var(--warn)}.tag.bad{background:var(--badb);color:var(--bad)}.tag.blue{background:var(--blueb);color:var(--blue)}.tag.acc{background:var(--acc2);color:var(--acc)}
.mut{color:var(--mut)}.small{font-size:12px}
.bar{height:8px;background:#eee;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* gantt */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.gt{position:relative}
.grow{display:flex;border-bottom:1px solid var(--line);min-height:40px}

.grow.sub .glab{font-weight:500;font-size:12px;padding-left:22px;background:#fcfbf9;color:var(--mut)}
.gtrack{position:relative;flex:none}
.gbar{position:absolute;top:9px;height:22px;border-radius:6px;background:var(--acc2);border:1px solid #e2c7b5;overflow:hidden;cursor:pointer;font-size:11px;font-weight:600;line-height:20px;padding:0 6px;white-space:nowrap;color:#6b3a1f}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);opacity:.35}
.gbar span{position:relative}
.gbar.done{background:var(--okb);border-color:#b9dcc8;color:var(--ok)}.gbar.done i{background:var(--ok)}
.gms{position:absolute;top:12px;width:14px;height:14px;background:var(--ink);transform:rotate(45deg);margin-left:-7px}
.gms.ok{background:var(--ok)}

.gdot.done{background:var(--ok)}.gdot.late{background:var(--bad)}
.ghead{display:flex;position:sticky;top:0;z-index:4;background:#faf8f5;border-bottom:1px solid var(--line);font-size:11px;color:var(--mut)}

.gmon{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:6px 4px;white-space:nowrap}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.gwk{position:absolute;top:0;bottom:0;border-left:1px dashed #efebe4;pointer-events:none}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col{background:#efebe4;border-radius:var(--r);padding:10px;min-height:120px}

.tk .subs{margin-top:6px;font-size:12px}

.tk .subs input{width:auto}
.av{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;align-items:center;justify-content:center;font-weight:700;flex:none}
/* docs */
.doc{display:flex;gap:12px;align-items:flex-start}
.thumb{width:84px;height:64px;border-radius:8px;background:#efebe4;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut);font-size:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.ver{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:12px;flex-wrap:wrap}
.old{opacity:.6}
.warnbox{background:var(--warnb);color:#6b4b0c;border-radius:9px;padding:8px 10px;font-size:12px;margin:8px 0}
.okbox{background:var(--okb);color:#1d5236;border-radius:9px;padding:8px 10px;font-size:12px;margin:8px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.md{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md.wide{max-width:980px}
.md h3{margin-bottom:12px}
.mact{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
/* markup */
.mkwrap{position:relative;display:inline-block;max-width:100%;touch-action:none;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#eee}
.mkwrap img{display:block;max-width:100%;max-height:70vh;user-select:none;-webkit-user-drag:none}
.mkwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;cursor:crosshair}
.sigpad{border:1px dashed #bbb;border-radius:9px;background:#fffdf8;touch-action:none;width:100%;height:150px;display:block}
.sig{height:50px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px}
/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;padding:4px}
.msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:86%}
.msg.me{align-self:flex-end;background:#fbf4ee;border-color:#ecd8c9}
.msg .h{font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.msg.co{border-left:4px solid var(--warn)}.msg.ins{border-left:4px solid var(--blue)}.msg.dec{border-left:4px solid var(--ok)}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photos img{width:86px;height:86px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)}
.stars{color:#d19a1d;letter-spacing:1px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.pcard{cursor:pointer}
.pcard:hover{border-color:#cfc8bb}
.lock{font-size:12px;color:var(--bad);font-weight:600}
@media (max-width:860px){
  .side{display:none}
  .top{padding:10px 12px}
  .top select{max-width:none;flex:1}
  .tabs{display:flex;overflow-x:auto;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:19;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{flex:none;padding:6px 11px;border-radius:20px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:12px}
  .tabs a.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  #view{padding:12px}
  .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr);gap:8px}.g2{grid-template-columns:1fr}
  .kpi{padding:10px}.kpi b{font-size:18px}.kpi span{font-size:11px}
  .kan{grid-template-columns:1fr}
  .glab{width:120px}
  form .row{grid-template-columns:1fr}
  .sync .lbl{display:none}
  .tmgrid{grid-template-columns:1fr 1fr}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">WIDEMP ATELIER<small>Pemantau Proyek</small></div><nav class="nav" id="nav"></nav></aside>
  <div class="main">
    <header class="top">
      <select id="psel" aria-label="Pilih proyek"></select>
      <button class="btn sm" id="newp">+ Proyek</button>
      <span class="sync" id="sync"><span class="dot" id="sdot"></span><span class="lbl" id="stxt">Memuat…</span></span>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <main id="view"></main>
  </div>
</div>
<div id="modals"></div>
<script id="appjs">
(function(){
'use strict';
/* ========== util ========== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const rp=n=>'Rp'+Math.round(+n||0).toLocaleString('id-ID');
const rpS=n=>{n=+n||0;const a=Math.abs(n);return (n<0?'-':'')+(a>=1e9?(a/1e9).toFixed(2).replace('.',',')+' M':a>=1e6?(a/1e6).toFixed(1).replace('.',',')+' jt':Math.round(a).toLocaleString('id-ID'))};
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const dd=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const fD=s=>s?new Date(s+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'2-digit'}):'-';
const fDT=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ini=n=>String(n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const PHASES=['Concept Design','3D Rendering','DED (Detail Engineering Design)','Konstruksi Fisik','Serah Terima (Handover)'];
const ROLES=['Arsitek Kepala','Desainer','Drafter','Estimator','Site Manager','Admin/Keuangan'];

/* ========== state ========== */
let S;
function seed(){return {v:1,savedAt:0,_pristine:true,team:[{id:'m1',name:'Saya',role:'Arsitek Kepala',rate:150000,cap:48}],projects:[],tasks:[],docs:[],rab:[],vendors:[],pos:[],terms:[],reports:[],times:[],timers:[],chats:[],insp:[],defects:[]}}
function loadState(){
  return null;
}
S=null;
if(!S){const c=lsGet('widemp_pm_cache');if(c){try{S=JSON.parse(c)}catch(e){}}}
if(!S)S=seed();
['team','projects','tasks','docs','rab','vendors','pos','terms','reports','times','timers','chats','insp','defects'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});

/* ========== penyimpanan lokal + sinkron Google Drive (login sama dengan aplikasi keuangan) ========== */
let mode='ready';
const COLS=['team','projects','tasks','docs','rab','vendors','pos','terms','reports','times','timers','chats','insp','defects'];
function setSync(cls,txt){const d=$('#sdot'),t=$('#stxt');if(d)d.className='dot '+cls;if(t)t.textContent=txt}
let syncT=null;
function save(msg){
  S.savedAt=Date.now();delete S._pristine;
  lsSet('widemp_pm_cache',JSON.stringify(S));
  if(msg)toast(msg);
  render();
  clearTimeout(syncT);
  if(driveReady()){setSync('busy','Menyimpan…');syncT=setTimeout(()=>syncNow(false),1500)}

}
const SCOPE='https://www.googleapis.com/auth/drive.file',DAPI='https://www.googleapis.com/drive/v3/files',UAPI='https://www.googleapis.com/upload/drive/v3/files';
const G={token:null,exp:0,tc:null,tcFor:'',gsi:null};
const clientId=()=>(lsGet('wk_client_id')||'').trim();
const driveReady=()=>!!clientId()&&navigator.onLine!==false;
function loadGsi(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();

  return G.gsi;
}
async function getToken(interactive){
  if(G.token&&Date.now()<G.exp)return G.token;
  const id=clientId();if(!id)throw new Error('Google Drive belum diatur di aplikasi keuangan');

    if(!G.tc||G.tcFor!==id){G.tc=google.accounts.oauth2.initTokenClient({client_id:id,scope:SCOPE,callback:()=>{}});G.tcFor=id}

async function gapi(url,opts){
  opts=opts||{};const r=await fetch(url,Object.assign({},opts,{headers:Object.assign({Authorization:'Bearer '+G.token},opts.headers||{})}));
  if(r.status===401){G.token=null;throw Object.assign(new Error('Perlu login Google'),{login:true})}

const gj=async(u,o)=>(await gapi(u,o)).json();
const ENS={};
async function ensure(name,mime,parent,key){
  const c=lsGet(key);
  if(c&&ENS[key]===c)return c;
  if(c){try{const m=await gj(DAPI+'/'+c+'?fields=id,trashed');if(!m.trashed){ENS[key]=c;return c}}catch(e){if(e.status!==404)throw e}try{localStorage.removeItem(key)}catch(e){}}
  const q="name='"+name.replace(/'/g,"\\'")+"' and mimeType='"+mime+"' and trashed=false"+(parent?" and '"+parent+"' in parents":'');
  const find=async()=>(await gj(DAPI+'?q='+encodeURIComponent(q)+'&orderBy=createdTime&fields=files(id,createdTime)&spaces=drive')).files||[];
  let f=await find();
  if(!f.length){const b={name,mimeType:mime};if(parent)b.parents=[parent];const mine=await gj(DAPI+'?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});f=await find();if(f.length&&f[0].id!==mine.id){try{await gapi(DAPI+'/'+mine.id,{method:'DELETE'})}catch(e){}}if(!f.length)f=[mine]}
  lsSet(key,f[0].id);ENS[key]=f[0].id;return f[0].id;
}
const folderId=()=>ensure('Widemp Atelier','application/vnd.google-apps.folder',null,'wk_folder_id');
async function dlText(id){return (await gapi(DAPI+'/'+id+'?alt=media')).text()}
const upJSON=(id,obj)=>gapi(UAPI+'/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
const fileVer=async id=>(await gj(DAPI+'/'+id+'?fields=version')).version;
function loadBase(){try{const b=localStorage.getItem('widemp_pm_base');return b?JSON.parse(b):null}catch(e){return null}}
function saveBase(o){lsSet('widemp_pm_base',JSON.stringify(o))}
function merge3(base,loc,rem){
  const out={v:1,savedAt:Math.max(loc.savedAt||0,rem.savedAt||0)};
  COLS.forEach(k=>{
    const B=new Map(((base&&base[k])||[]).map(x=>[x.id,JSON.stringify(x)])),L=new Map((loc[k]||[]).map(x=>[x.id,x])),Rm=new Map((rem[k]||[]).map(x=>[x.id,x]));
    const order=[...(rem[k]||[]).map(x=>x.id),...(loc[k]||[]).map(x=>x.id).filter(id=>!Rm.has(id))],res=[],seen=new Set();
    for(const id of order){if(seen.has(id))continue;seen.add(id);const l=L.get(id),r=Rm.get(id),b=B.get(id);
      let pick;
      if(!base)pick=l||r;
      else{const lc=l?JSON.stringify(l)!==b:b!==undefined,rc=r?JSON.stringify(r)!==b:b!==undefined;pick=lc&&!rc?l:rc&&!lc?r:lc&&rc?(l||r):(r||l)}

function shrink(file,max,q,asBlob){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);if(asBlob)c.toBlob(b=>res(b),'image/jpeg',q);else res(c.toDataURL('image/jpeg',q))};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Gambar tidak bisa dibaca'))};img.src=u})}
async function storeFile(file){
  const kind=file.type.startsWith('image/')?'img':file.type==='application/pdf'?'pdf':'other';
  let blob=file;if(kind==='img'){try{blob=await shrink(file,1800,.82,true)}catch(e){blob=file}}
  const nm=today()+' '+(kind==='img'?file.name.replace(/\.[^.]+$/,'')+'.jpg':file.name),ref='lc:'+uid();
  await blobPut(ref,blob);
  UPQ.push({ref,name:nm,pid:PID,cat:CATF[V]||'Lainnya'});saveUpq();setTimeout(kickUploads,300);
  return {name:file.name,url:ref,kind};
}

/* ---- RAB terpadu (aplikasi keuangan / lokal) + nilai terpasang ---- */
const vnum=r=>{const m=String(r.version||'').match(/^V?(\d+)(?:\.(\d+))?/i);return m?(+m[1])*1000+(+m[2]||0):0};
function rabSource(p){
  const l=p&&p.finId?finRecs('rab').filter(r=>r.projectId===p.finId):[];
  if(l.length){
    const base=l.find(r=>r.final)||null,cc=l.filter(r=>r.cco).sort((a,b)=>vnum(b)-vnum(a)||(b.updatedAt||0)-(a.updatedAt||0));
    const cur=cc[0]||base||l.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
    const key=it=>it.baseId||it.id,bm=new Map(),seen=new Set(),items=[];
    (base?base.items||[]:[]).forEach(it=>bm.set(key(it),it));
    const mk=(it,b)=>{const total=Math.round((+it.qty||0)*(+it.price||0));return {key:key(it),div:it.division||'Lain-lain',desc:(it.desc||'(tanpa uraian)')+(it.room?' · '+it.room:''),unit:it.unit||'',qty:+it.qty||0,price:+it.price||0,total,baseTotal:b?Math.round((+b.qty||0)*(+b.price||0)):(base?0:total),isNew:!!base&&!b}};
    (cur.items||[]).forEach(it=>{seen.add(key(it));items.push(mk(it,bm.get(key(it))))});
    if(base&&cur!==base)(base.items||[]).forEach(it=>{if(!seen.has(key(it)))items.push(mk(Object.assign({},it,{qty:0}),it))});
    return {src:'fin',base,cur,items};
  }
  return {src:'local',items:S.rab.filter(r=>r.pid===p.id).map(r=>({key:r.id,div:r.cat||'Lainnya',desc:r.item,unit:r.unit,qty:+r.vol||0,price:+r.price||0,total:rabBudget(r),baseTotal:r.base!=null?+r.base:rabBudget(r),isNew:false,local:r}))};
}
function rabCosts(p,src){
  const m={};let unalloc=0;const add=(k,d,a)=>{(m[k]=m[k]||[]).push({date:d||'',amount:+a||0})};
  if(src.src==='fin'){const keys=new Set(src.items.map(i=>i.key));finRecs('tx').filter(t=>t.kind==='out'&&t.projectId===p.finId).forEach(t=>{if(t.rabItemId&&keys.has(t.rabItemId))add(t.rabItemId,t.date,t.amount);else unalloc+=(+t.amount||0)})}
  else S.rab.filter(r=>r.pid===p.id).forEach(r=>(r.actual||[]).forEach(a=>add(r.id,a.date,a.amount)));
  return {m,unalloc};
}
function conSpan(p){const f=p.phases.find(x=>/konstruksi|pengawasan|pelaksanaan|pembangunan/i.test(x.name));if(f)return [f.start,f.end];if(!p.phases.length)return [p.start||today(),addD(p.start||today(),60)];return [p.phases.reduce((m,x)=>x.start<m?x.start:m,p.phases[0].start),p.phases.reduce((m,x)=>x.end>m?x.end:m,p.phases[0].end)]}
function itemPlan(p,k){const pl=(p.rabPlan||{})[k];const d=conSpan(p);return pl&&pl.s&&pl.e?[pl.s,pl.e]:d}
function planFrac(s,e,d){if(d<s)return 0;if(d>=e)return 1;return Math.max(0,Math.min(1,(dd(s,d)+1)/(dd(s,e)+1)))}
function progAt(p,k,d){let v=0;(p.rabProg||[]).slice().sort((a,b)=>a.w<b.w?-1:1).forEach(e=>{if(e.w<=d&&e.v&&e.v[k]!=null)v=+e.v[k]});return v}
const monday=d=>{const x=new Date(d+'T00:00');const k=(x.getDay()+6)%7;return addD(d,-k)};
function evm(p){
  const src=rabSource(p),items=src.items.filter(i=>i.total>0||i.baseTotal>0),B=items.reduce((s,i)=>s+i.total,0),B0=items.reduce((s,i)=>s+i.baseTotal,0);
  if(!B)return null;
  const C=rabCosts(p,src),t=today();
  const rows=items.map(i=>{const [s,e]=itemPlan(p,i.key);const pf=planFrac(s,e,t),pr=progAt(p,i.key,t);const ev=i.total*pr/100,ac=(C.m[i.key]||[]).filter(x=>x.date<=t).reduce((a,x)=>a+x.amount,0);
    return Object.assign({},i,{s,e,w:i.total/B*100,plan:Math.round(pf*1000)/10,prog:pr,ev,ac,cv:ev-ac,sv:Math.round((pr-pf*100)*10)/10})});
  let a=rows.reduce((m,r)=>r.s<m?r.s:m,rows[0].s),z=rows.reduce((m,r)=>r.e>m?r.e:m,rows[0].e);if(t>z)z=t;
  (p.rabProg||[]).forEach(e=>{if(e.w<a)a=e.w});
  const weeks=[];for(let w=monday(a);w<=z;w=addD(w,7))weeks.push(w);
  const series=weeks.map(w=>{const we=addD(w,6);let pv=0,ev=0,ac=0;rows.forEach(r=>{pv+=r.total*planFrac(r.s,r.e,we);ev+=r.total*progAt(p,r.key,we)/100;ac+=(C.m[r.key]||[]).filter(x=>x.date<=we).reduce((s,x)=>s+x.amount,0)});return {w,we,pv:pv/B*100,ev:ev/B*100,ac:ac/B*100,past:w<=t}});
  const EV=rows.reduce((s,r)=>s+r.ev,0),AC=rows.reduce((s,r)=>s+r.ac,0),PV=rows.reduce((s,r)=>s+r.total*r.plan/100,0);
  return {src,rows,B,B0,EV,AC,PV,series,unalloc:C.unalloc,pPlan:Math.round(PV/B*1000)/10,pProg:Math.round(EV/B*1000)/10,pCost:Math.round(AC/B*1000)/10};
}
function sCurveRab(E){
  const sr=E.series,W=660,H=250,L=40,T=12,Rr=12,Bt=30,iw=W-L-Rr,ih=H-T-Bt,n=Math.max(1,sr.length-1);

  const line=(k,c,dash,only)=>{const pts=sr.map((s,i)=>[i,s]).filter(x=>!only||x[1].past);return pts.length?'<polyline fill="none" stroke="'+c+'" stroke-width="2.4"'+(dash?' stroke-dasharray="'+dash+'"':'')+' points="'+pts.map(x=>X(x[0]).toFixed(1)+','+Y(x[1][k]).toFixed(1)).join(' ')+'"/>':''};
  const dots=(k,c)=>sr.map((s,i)=>s.past?'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(s[k]).toFixed(1)+'" r="2.6" fill="'+c+'"><title>Minggu '+(i+1)+' ('+fD(s.w)+'): '+s[k].toFixed(1)+'%</title></circle>':'').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+line('pv','#9a9388','6 4')+line('ev','#2f5f8a',0,1)+line('ac','#b3392f',0,1)+dots('ev','#2f5f8a')+dots('ac','#b3392f')+'</svg>'+
    '<div class="small mut" style="display:flex;gap:14px;flex-wrap:wrap"><span><b style="color:#9a9388">- - -</b> Rencana (bobot RAB × jadwal)</span><span><b style="color:var(--blue)">——</b> Realisasi fisik (nilai terpasang)</span><span><b style="color:var(--bad)">——</b> Biaya aktual</span><span>M = minggu ke-</span></div>';
}
function evmKpis(E){
  const cv=E.EV-E.AC,sv=Math.round((E.pProg-E.pPlan)*10)/10;
  return '<div class="grid g4" style="margin-bottom:12px">'+kpi('Rencana s/d minggu ini',E.pPlan+'%','')+kpi('Realisasi fisik',E.pProg+'%',sv<-5?'bad':sv<0?'warn':'ok',(sv>0?'+':'')+sv+'% '+(sv<0?'terlambat':'dari rencana'))+kpi('Biaya terpakai',E.pCost+'%',E.pCost>E.pProg?'bad':'',rpS(E.AC)+' dari '+rpS(E.B))+kpi('Selisih biaya',(cv<0?'−':'+')+rpS(Math.abs(cv)),cv<0?'bad':'ok',cv<0?'boros dibanding nilai terpasang':'hemat dibanding nilai terpasang')+'</div>';

function evmProblems(E){
  const bad=E.rows.filter(r=>r.cv<-1||r.sv<-5).sort((a,b)=>(a.cv+a.sv*1e4)-(b.cv+b.sv*1e4));

  h+='<div class="card tw">'+(pos.length?'<table><tr><th>No. PO</th><th>Vendor</th><th>Tanggal</th><th class="num">Total</th><th>Status</th><th></th></tr>'+pos.slice().reverse().map(o=>'<tr><td><a href="#" data-po="'+o.id+'">'+esc(o.no)+'</a></td><td>'+esc((ven(o.vendor)||{}).name||'-')+'</td><td>'+fD(o.date)+'</td><td class="num">'+rp(tot(o))+'</td><td>'+poTag(o.status)+'</td><td><select data-pst="'+o.id+'" style="width:auto;padding:4px">'+opt(['Draft','Dikirim','Diterima','Dibayar'],o.status)+'</select></td></tr>').join('')+'</table>':'<div class="empty">Belum ada PO. Gunakan “Buat PO dari RAB” untuk memilih item RAB dan vendor — PO, riwayat harga vendor, dan biaya aktual RAB akan terisi otomatis.</div>')+'</div>';
  const paidAmt=terms.filter(x=>x.status==='Lunas').reduce((s,x)=>s+termAmt(x),0);const paid=p.value?Math.round(paidAmt/p.value*100):0;
  h+='<div class="hd" style="margin-top:20px"><h2>Termin Pembayaran Klien</h2><span class="sp"></span>'+(p.finId?'<a class="btn" href="'+FIN_URL+'">Kelola di aplikasi keuangan</a>':'<button class="btn pri" id="addTm">+ Termin</button>')+'</div>'+(p.finId?'<div class="okbox">🔗 Termin & pembayaran proyek ini otomatis mengikuti aplikasi keuangan'+(FIN?' (diperbarui '+fDT(finAt)+')':'')+'. Buat invoice, kwitansi, dan catat pembayaran di sana — status di sini ikut berubah.</div>':'');
  h+='<div class="grid g3" style="margin-bottom:12px">'+kpi('Nilai kontrak',rpS(p.value),'')+kpi('Sudah dibayar',rpS(paidAmt),'ok',paid+'%')+kpi('Progres proyek',pr+'%','')+'</div>';
  h+='<div class="card">'+(terms.length?'<div class="list">'+terms.map(x=>{const amt=termAmt(x);const ready=termReady(x);
    return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:160px"><b>'+esc(x.name)+'</b><div class="small mut">'+(Math.round((+x.pct||0)*10)/10)+'% · '+rp(amt)+' · '+(x.due?'jatuh tempo '+fD(x.due):'ditagih saat progres ≥ '+(x.trigger||0)+'%')+(x.inv?' · '+esc(x.inv):'')+'</div></div>'+
    (ready?'<span class="tag ok">● Siap ditagih</span>':'')+'<span class="tag '+(x.status==='Lunas'?'ok':x.status==='Ditagih'?'warn':'')+'">'+esc(x.status)+'</span>'+
    (x.finId?((x.paid&&x.status!=='Lunas'?'<span class="small mut">dibayar '+rpS(x.paid)+'</span>':'')+(x.status!=='Lunas'?'<a class="btn sm" href="'+FIN_URL+'">'+(x.status==='Belum'?'Buat invoice':'Catat bayar')+'</a>':'')+(x.due||x.status==='Lunas'?'':'<button class="btn sm ghost" data-trg="'+x.id+'">Atur pemicu</button>')):(x.status!=='Lunas'?'<button class="btn sm" data-inv="'+x.id+'">'+(x.status==='Belum'?'Tagih':'Lunas ✓')+'</button>':'')+'<button class="btn sm ghost" data-tm="'+x.id+'">Edit</button>')+'</div>'}).join('')+'</div>':'<div class="empty">Belum ada termin.</div>')+'</div>';

function poFromRab(manual){

    (manual?'<div id="mItems"></div><button class="btn sm" id="mAdd">+ Baris</button>':'<div class="tw"><table><tr><th></th><th>Item RAB</th><th>Qty</th><th>Harga sat.</th></tr>'+(rows||'<tr><td colspan="4" class="mut">Belum ada item RAB.</td></tr>')+'</table></div>')+
    fieldHTML({k:'note',label:'Catatan untuk vendor',type:'textarea',rows:2,ph:'Alamat kirim, jam bongkar, dll.'},'Kirim ke lokasi proyek '+(p.location||''))+
    '<div class="mact"><span class="sp"></span><button class="btn ghost" data-close>Batal</button><button class="btn pri" id="poGo">Buat PO</button></div>',true);
  if(manual){const add=()=>{const d=document.createElement('div');d.className='row';d.style.gridTemplateColumns='2fr 1fr 1fr 1.3fr';d.style.display='grid';d.style.gap='6px';d.style.marginBottom='6px';d.innerHTML='<input placeholder="Uraian" class="mi-d"><input placeholder="Sat" class="mi-u"><input type="number" step="any" placeholder="Qty" class="mi-q"><input type="number" placeholder="Harga" class="mi-p">';ov.querySelector('#mItems').appendChild(d)};add();add();ov.querySelector('#mAdd').onclick=add}

    else ov.querySelectorAll('[data-ri]:checked').forEach(c=>{const r=S.rab.find(x=>x.id===c.dataset.ri);its.push({desc:r.item,unit:r.unit,qty:+ov.querySelector('[data-q="'+r.id+'"]').value||0,price:+ov.querySelector('[data-pr="'+r.id+'"]').value||0,rab:r.id})});
    if(!its.length){toast('Pilih minimal satu item');return}
    const o={id:uid(),no:nextNo('PO',S.pos),pid:p.id,vendor:vid,date:today(),need:ov.querySelector('[name=date]').value,note:ov.querySelector('[name=note]').value,items:its,status:'Draft'};
    S.pos.push(o);const v=ven(vid);its.forEach(i=>v.prices.push({item:i.desc,unit:i.unit,price:i.price,date:today()}));

function planAt(p,d){if(!p.phases.length)return 0;let w=0,s=0;p.phases.forEach(f=>{const du=Math.max(1,dd(f.start,f.end));w+=du;s+=du*Math.max(0,Math.min(1,dd(f.start,d)/du))});return Math.round(s/w*1000)/10}
function sCurve(p){
  if(!p.phases.length)return '<div class="empty">Tambahkan tahap di menu Jadwal dulu.</div>';
  const a=p.phases.reduce((m,f)=>f.start<m?f.start:m,p.phases[0].start),b=p.phases.reduce((m,f)=>f.end>m?f.end:m,p.phases[0].end);
  const span=Math.max(1,dd(a,b)),W=640,H=230,L=36,T=12,Rr=12,B=28,iw=W-L-Rr,ih=H-T-B;
  const X=d=>L+Math.max(0,Math.min(1,dd(a,d)/span))*iw,Y=v=>T+ih-(v/100)*ih;
  let plan=[];for(let i=0;i<=40;i++){const d=addD(a,Math.round(span*i/40));plan.push(X(d).toFixed(1)+','+Y(planAt(p,d)).toFixed(1))}
  const act=S.reports.filter(r=>r.pid===p.id&&r.total!=null).sort((x,y)=>x.date<y.date?-1:1).map(r=>[r.date,+r.total]);
  const t=today();if(t>=a){act.push([t>b?b:t,progOf(p)])}
  const pts=[[a,0]].concat(act);
  let g='';[0,25,50,75,100].forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#eee"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" font-size="10" text-anchor="end" fill="#888">'+v+'%</text>'});
  let d=new Date(a+'T00:00');d.setDate(1);while(iso(d)<=b){const s=iso(d);if(s>=a)g+='<line x1="'+X(s)+'" x2="'+X(s)+'" y1="'+T+'" y2="'+(T+ih)+'" stroke="#f2efe9"/><text x="'+X(s)+'" y="'+(H-10)+'" font-size="10" fill="#888" text-anchor="middle">'+d.toLocaleDateString('id-ID',{month:'short'})+'</text>';d.setMonth(d.getMonth()+1)}
  const tl=t>=a&&t<=b?'<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+T+'" y2="'+(T+ih)+'" stroke="#b3392f" stroke-dasharray="3 3"/>':'';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+tl+'<polyline fill="none" stroke="#9a9388" stroke-width="2" stroke-dasharray="6 4" points="'+plan.join(' ')+'"/><polyline fill="none" stroke="#b5653b" stroke-width="2.5" points="'+pts.map(q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join(' ')+'"/>'+pts.slice(1).map(q=>'<circle cx="'+X(q[0]).toFixed(1)+'" cy="'+Y(q[1]).toFixed(1)+'" r="3" fill="#b5653b"><title>'+fD(q[0])+': '+q[1]+'%</title></circle>').join('')+'</svg><div class="small mut" style="display:flex;gap:14px;flex-wrap:wrap"><span><b style="color:#9a9388">- - -</b> Rencana</span><span><b style="color:var(--acc)">——</b> Realisasi (dari laporan harian)</span><span><b style="color:var(--bad)">┆</b> Hari ini</span></div>';
}

  h+='<div class="card"><div class="msgs" id="msgs">'+(l.length?l.map(c=>{const m=mem(c.by)||{};
    return '<div class="msg '+(CT[c.type]||'')+(c.by===me()?' me':'')+'"><div class="h"><b>'+esc(m.name||'?')+'</b><span>'+esc(m.role||'')+'</span><span>· '+fDT(c.at)+'</span>'+(c.type!=='Diskusi'?'<span class="tag '+(c.type==='Change Order'?'warn':c.type==='Keputusan'?'ok':'blue')+'">'+esc(c.type)+'</span>':'')+(c.status?'<span class="tag '+(c.status==='Disetujui'||c.status==='Selesai'?'ok':c.status==='Ditolak'?'bad':'')+'">'+esc(c.status)+'</span>':'')+'</div><div style="white-space:pre-wrap">'+esc(c.text)+'</div>'+
    (c.type==='Change Order'?'<div class="small" style="margin-top:6px">Dampak: <b>'+rp(c.cost)+'</b> · <b>'+(c.days||0)+' hari</b></div>':'')+
    (c.photo?'<div class="photos"><img '+imgAttr(c.photo)+' data-img="'+esc(c.photo)+'"></div>':'')+
    '<div class="mact" style="margin-top:6px">'+(c.type==='Change Order'&&c.status==='Diajukan'?'<button class="btn sm" data-cs="'+c.id+'" data-v="Disetujui">Setujui</button><button class="btn sm" data-cs="'+c.id+'" data-v="Ditolak">Tolak</button>':'')+(c.type==='Instruksi Lapangan'&&c.status!=='Selesai'?'<button class="btn sm" data-cs="'+c.id+'" data-v="Selesai">Tandai dilaksanakan</button>':'')+'<button class="btn sm ghost" data-cd="'+c.id+'">Hapus</button></div></div>'}).join(''):'<div class="empty">Belum ada percakapan.</div>')+'</div></div>';
  h+='<div class="card"><div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="fld"><span>Sebagai</span><select id="cBy">'+opt(S.team.map(m=>[m.id,m.name+' ('+m.role+')']),me())+'</select></label><label class="fld"><span>Jenis</span><select id="cTy">'+opt(Object.keys(CT),f||'Diskusi')+'</select></label></div>'+
    '<div id="coF" style="display:none;grid-template-columns:1fr 1fr;gap:8px" class="row"><label class="fld"><span>Tambahan biaya (Rp)</span><input type="number" id="cCost"></label><label class="fld"><span>Tambahan waktu (hari)</span><input type="number" id="cDays"></label></div>'+
    '<textarea id="cTx" rows="3" placeholder="Tulis pesan, keputusan, atau instruksi…"></textarea><div class="mact"><input type="file" id="cPh" accept="image/*" style="width:auto;flex:1"><button class="btn pri" id="cSend">Kirim</button></div></div>';
  return h;
};
AFTER.diskusi=()=>{
  const ms=$('#msgs');if(ms)ms.scrollTop=ms.scrollHeight;
  $$('[data-cf]').forEach(c=>c.onclick=()=>{UI.chatFilter=c.dataset.cf;render()});
  const ty=$('#cTy'),cf=$('#coF');const sh=()=>cf.style.display=ty.value==='Change Order'?'grid':'none';ty.onchange=sh;sh();
  $('#cBy').onchange=e=>lsSet('widemp_me',e.target.value);
  $('#cSend').onclick=async()=>{const tx=$('#cTx').value.trim();if(!tx){toast('Tulis pesan dulu');return}const b=$('#cSend');b.disabled=true;
    let photo='';const fl=$('#cPh').files[0];if(fl){const s=await storeFile(fl);photo=s.url}
    const t=ty.value;S.chats.push({id:uid(),pid:PID,type:t,by:$('#cBy').value,at:Date.now(),text:tx,photo,status:t==='Change Order'?'Diajukan':t==='Instruksi Lapangan'?'Belum':'',cost:+($('#cCost')||{}).value||0,days:+($('#cDays')||{}).value||0});
    lsSet('widemp_me',$('#cBy').value);save()};
  $$('[data-cs]').forEach(b=>b.onclick=()=>{const c=S.chats.find(x=>x.id===b.dataset.cs);c.status=b.dataset.v;c.decidedBy=me();c.decidedAt=Date.now();save('Status: '+c.status)});
  $$('[data-cd]').forEach(b=>b.onclick=()=>{if(b.dataset.c){S.chats=S.chats.filter(x=>x.id!==b.dataset.cd);save()}else{b.dataset.c=1;b.textContent='Yakin?'}});
  $$('[data-img]').forEach(i=>i.onclick=()=>viewImg(i.dataset.img));
};

/* ---- Pengaturan ---- */
R.pengaturan=()=>{
  let h='<div class="hd"><h2>Pengaturan</h2></div>';
  h+='<div class="card"><div class="hd" style="margin-bottom:6px"><h3>Tim</h3><span class="sp"></span><button class="btn sm pri" id="addM">+ Anggota</button></div><div class="tw"><table><tr><th>Nama</th><th>Peran</th><th class="num">Tarif/jam</th><th class="num">Kapasitas/minggu</th><th></th></tr>'+S.team.map(m=>'<tr><td><span class="av">'+ini(m.name)+'</span> '+esc(m.name)+(m.id===me()?' <span class="tag acc">saya di perangkat ini</span>':'')+'</td><td>'+esc(m.role)+'</td><td class="num">'+rp(m.rate)+'</td><td class="num">'+(m.cap||0)+' jam</td><td><button class="btn sm ghost" data-em="'+m.id+'">Edit</button></td></tr>').join('')+'</table></div>'+
    '<label class="fld" style="margin-top:10px;max-width:320px"><span>Saya di perangkat ini adalah</span><select id="meSel">'+opt(S.team.map(m=>[m.id,m.name]),me())+'</select></label></div>';
  h+='<div class="card"><div class="hd" style="margin-bottom:6px"><h3>Proyek</h3><span class="sp"></span><button class="btn sm pri" onclick="WP.newProject()">+ Proyek</button></div><div class="list">'+S.projects.map(p=>'<div style="display:flex;gap:8px;align-items:center"><b style="flex:1">'+esc(p.name)+'</b>'+stTag(p.status)+'<button class="btn sm ghost" data-ep="'+p.id+'">Edit / hapus</button></div>').join('')+'</div></div>';
  h+=finCard();
  h+='<div class="card"><h3 style="margin-bottom:6px">Sinkronisasi & cadangan</h3><p class="small mut">'+(clientId()?'Data tersimpan di perangkat ini dan disinkronkan ke Google Drive (folder “Widemp Atelier”, file widemp-proyek.json; file & foto di Widemp Atelier › Foto & Gambar Proyek › nama proyek › jenis) memakai login Google yang sama dengan aplikasi keuangan. '+(lastSync?'Sinkron terakhir: '+fDT(lastSync)+'.':'Belum pernah sinkron.')+' <button class="btn sm" onclick="WP.sync()">⟳ Sinkron sekarang</button>':'Google Drive belum diatur. Buka aplikasi keuangan → menu Data → sambungkan Google Drive, lalu kembali ke sini.')+'</p><div class="mact"><button class="btn" id="bkC">Salin cadangan (JSON)</button><button class="btn" id="bkI">Pulihkan dari cadangan</button></div></div>';
  return h;
};
AFTER.pengaturan=()=>{
  finCardBind();
  $('#addM').onclick=()=>memForm();
  $$('[data-em]').forEach(b=>b.onclick=()=>memForm(mem(b.dataset.em)));
  $$('[data-ep]').forEach(b=>b.onclick=()=>newProject(proj(b.dataset.ep)));
  $('#meSel').onchange=e=>{lsSet('widemp_me',e.target.value);render()};
  $('#bkC').onclick=()=>copyText(JSON.stringify(S));
  $('#bkI').onclick=()=>{const ov=openModal('<h3>Pulihkan cadangan</h3><div class="warnbox">Seluruh data saat ini akan diganti dengan isi cadangan.</div><textarea rows="8" id="bkT" placeholder="Tempel JSON cadangan di sini"></textarea><div class="mact"><span class="sp"></span><button class="btn ghost" data-close>Batal</button><button class="btn pri" id="bkGo">Pulihkan</button></div>');
    ov.querySelector('#bkGo').onclick=()=>{try{const d=JSON.parse(ov.querySelector('#bkT').value);if(!d.v||!Array.isArray(d.projects))throw 0;S=d;['team','projects','tasks','docs','rab','vendors','pos','terms','reports','times','timers','chats','insp','defects'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});PID=(S.projects[0]||{}).id||'';ov.remove();save('Data dipulihkan')}catch(e){toast('Format cadangan tidak valid')}}};
};
function restoreForm(){
  const ov=openModal('<h3>Pindahkan / pulihkan data</h3><p class="small mut">Di aplikasi lama (link claude.ai) ketuk <b>Salin data untuk dipindahkan</b> (atau Pengaturan → Salin cadangan), lalu tempel di sini.</p><textarea rows="8" id="bkT" placeholder="Tempel data di sini"></textarea><div class="mact"><span class="sp"></span><button class="btn ghost" data-close>Batal</button><button class="btn pri" id="bkGo">Pulihkan</button></div>');
  ov.querySelector('#bkGo').onclick=()=>{try{const d=JSON.parse(ov.querySelector('#bkT').value.trim());if(!d.v||!Array.isArray(d.projects))throw 0;COLS.forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.savedAt=Date.now();delete d._pristine;d.projects.forEach(p=>{if(p.progAt==null&&(p.status==='Selesai'||(p.phases||[]).some(f=>+f.progress>0)))p.progAt=Date.now()});d._replace=true;S=d;lsSet('wp_mig_hide','1');try{localStorage.removeItem('widemp_pm_base')}catch(e){}PID=(S.projects[0]||{}).id||'';lsSet('widemp_pid',PID);ov.remove();save(S.projects.length+' proyek dipulihkan')}catch(e){toast('Format data tidak valid — pastikan seluruh teks tersalin')}};
}
function memForm(m){const isNew=!m;
  openForm({title:isNew?'Anggota tim':'Edit anggota',values:m||{role:'Desainer',cap:40,rate:50000},fields:[{k:'name',label:'Nama',req:1},{k:'role',label:'Peran',type:'select',options:ROLES},{k:'rate',label:'Tarif per jam (Rp)',type:'number',half:1,hint:'untuk hitung profitabilitas'},{k:'cap',label:'Kapasitas jam/minggu',type:'number',half:1}],
  onDelete:isNew||S.team.length<2?null:()=>{S.team=S.team.filter(x=>x!==m);save('Anggota dihapus')},
  onSubmit:v=>{if(isNew)S.team.push(Object.assign({id:'m'+uid()},v));else Object.assign(m,v);save('Tim diperbarui')}})}

window.WP={newProject:()=>newProject(),sync:()=>syncNow(true),restore:()=>restoreForm(),hideMig:()=>{lsSet('wp_mig_hide','1');render()}};
render();
{const sy=$('#sync');sy.style.cursor='pointer';sy.title='Ketuk untuk sinkron';sy.onclick=()=>syncNow(true);}
setSync('off',clientId()?(lastSync?'Menyambungkan…':'Ketuk untuk menyambungkan Google Drive'):'Atur Google Drive di aplikasi keuangan');
loadFinLocal();
if(clientId())syncNow(false);
setInterval(()=>{if(document.visibilityState==='visible'&&clientId())syncNow(false)},300000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&clientId()&&Date.now()-lastSync>60000)syncNow(false)});
window.addEventListener('online',()=>{if(clientId())syncNow(false)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
